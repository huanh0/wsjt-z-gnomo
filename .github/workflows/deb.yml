name: Build Debian Package for WSJT-Z

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-deb:
    runs-on: ubuntu-latest

    container:
      image: debian:forky-slim
      options: --user root

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install build dependencies
      run: |
        apt-get update
        apt-get install -y --no-install-recommends \
          build-essential cmake git \
          gfortran autoconf automake libtool \
          pkg-config texinfo \
          asciidoctor asciidoc docbook-xsl \
          libfftw3-dev libboost-all-dev \
          qtbase5-dev qtdeclarative5-dev qtmultimedia5-dev \
          libqt5serialport5-dev libqt5opengl5-dev libqt5websockets5-dev \
          libqt5sql5-sqlite \
          qttools5-dev qttools5-dev-tools \
          libusb-1.0-0-dev libudev-dev \
          libreadline-dev portaudio19-dev \
          libhamlib-dev \
          libhamlib-utils \
          dpkg-dev debhelper fakeroot \
          rpm

    - name: Add GCC 16 workaround to CMakeLists.txt
      run: |
        printf "\n" >> CMakeLists.txt
        printf "# -----------------------------------------------------------------------------\n" >> CMakeLists.txt
        printf "# Local build fix for GCC 16 on Linux (Debian testing/forky and relatives).\n" >> CMakeLists.txt
        printf "#\n" >> CMakeLists.txt
        printf "# GCC 16 added a stricter -Wmaybe-uninitialized analysis that produces a\n" >> CMakeLists.txt
        printf "# false positive on the placement-new'd HRDMessage flexible-array struct in\n" >> CMakeLists.txt
        printf "# Transceiver/HRDTransceiver.cpp.  Because this project unconditionally adds\n" >> CMakeLists.txt
        printf "# -Werror, that one false positive stops the whole build.  Demote only that\n" >> CMakeLists.txt
        printf "# one warning class from error to warning, only for GCC >= 16.  All other\n" >> CMakeLists.txt
        printf "# warnings continue to be treated as errors, preserving the project's\n" >> CMakeLists.txt
        printf "# warning discipline.\n" >> CMakeLists.txt
        printf "# -----------------------------------------------------------------------------\n" >> CMakeLists.txt
        printf 'if (CMAKE_CXX_COMPILER_ID STREQUAL "GNU" AND\n' >> CMakeLists.txt
        printf '    CMAKE_CXX_COMPILER_VERSION VERSION_GREATER_EQUAL "16.0")\n' >> CMakeLists.txt
        printf '  set (CMAKE_CXX_FLAGS "${CMAKE_CXX_FLAGS} -Wno-error=maybe-uninitialized")\n' >> CMakeLists.txt
        printf 'endif ()\n' >> CMakeLists.txt
        echo "--- appended block ---"
        tail -n 20 CMakeLists.txt

    - name: Configure with CMake
      run: |
        cmake -S . -B build \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
          -DWSJT_SKIP_MANPAGES=ON \
          -DWSJT_GENERATE_DOCS=OFF \
          -DCMAKE_INSTALL_PREFIX=/usr

    - name: Build
      run: |
        cmake --build build -j$(nproc)

    - name: Verify binary was produced
      run: |
        file build/wsjtx
        file build/wsjtx | grep -q "ELF 64-bit"

    - name: Package .deb
      run: |
        cd build
        cpack -G DEB \
          -D "CPACK_DEBIAN_FILE_NAME=wsjtz_${GITHUB_REF_NAME}_amd64.deb"

        DEB=$(ls *.deb 2>/dev/null | head -1)
        if [ -z "$DEB" ]; then
          echo "::error::cpack -G DEB produced no .deb file"
          ls -la
          exit 1
        fi
        ls -lh "$DEB"
        file "$DEB"

    - name: Upload .deb artifact
      uses: actions/upload-artifact@v4
      with:
        name: wsjtz-deb-forky
        path: build/*.deb
        if-no-files-found: error
